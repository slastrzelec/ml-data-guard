name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: The tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re, tomllib
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          module = re.search(r'__version__ = "([^"]+)"', open("src/mlguard/__init__.py").read())[1]
          action = re.search(r"default: ml-data-guard==(\S+)", open("action.yml").read())[1]
          tag = os.environ["TAG"].removeprefix("v")
          if len({tag, project, module, action}) != 1:
              raise SystemExit(f"tag {tag}, pyproject {project}, module {module}, action {action}")
          PY
      - name: Build
        run: |
          python -m pip install --upgrade pip
          pip install "build>=1.2,<2" "twine>=7,<8"
          python -m build
          twine check --strict dist/*
      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/mlguard --version
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ml-data-guard/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
