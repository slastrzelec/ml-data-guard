name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests with coverage
        run: pytest --cov --cov-report=term-missing
      - name: Dependency audit
        run: pip-audit -r requirements-dev.txt

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Example data and schema
        run: |
          pip install -e .
          python examples/make_example_data.py
          mlguard infer examples/data/reference.csv -o examples/data/schema.json --exclude id,target
      - name: The action passes a clean batch
        uses: ./
        with:
          batch: examples/data/batch_ok.csv
          schema: examples/data/schema.json
          reference: examples/data/reference.csv
          package: .
      - name: The action rejects a broken batch
        id: broken
        continue-on-error: true
        uses: ./
        with:
          batch: examples/data/batch_broken.csv
          schema: examples/data/schema.json
          package: .
      - name: Fail unless the broken batch was rejected
        if: ${{ steps.broken.outcome != 'failure' }}
        run: |
          echo "the action accepted a batch with three injected faults"
          exit 1

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t mlguard-api .
      - name: The service answers inside the container
        run: |
          docker run -d --name api -p 7860:7860 mlguard-api
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7860/api/v1/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:7860/api/v1/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:7860/ | grep -q 'Check your file'
          curl -fsS -X POST http://127.0.0.1:7860/api/v1/demo \
            -H 'Content-Type: application/json' \
            -d '{"fault":"unit_change","severity":0.05}' | grep -q '"faulty"'
      - name: The container runs as a non-root user and logs no client address
        run: |
          test "$(docker exec api id -u)" = "1000"
          docker logs api 2>&1 | tee container.log
          ! grep -E '172\.17\.|127\.0\.0\.1:[0-9]+ -' container.log

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Mutation checks
        run: python tools/mutation_check.py
