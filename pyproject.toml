[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ml-data-guard"
version = "0.1.0"
description = "Data validation for ML pipelines, benchmarked with injected faults."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sławomir Strzelec" }]
keywords = ["data-validation", "machine-learning", "data-drift", "benchmark", "mlops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "scipy>=1.11,<2",
]

[project.optional-dependencies]
bench = [
    "scikit-learn>=1.5,<2",
]
figures = [
    "matplotlib>=3.8,<4",
]
dev = [
    "scikit-learn>=1.5,<2",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "hypothesis>=6.100,<7",
    "ruff>=0.6,<1",
    "pip-audit>=2.7,<3",
]

[project.scripts]
mlguard = "mlguard.cli:main"

[project.urls]
Repository = "https://github.com/slastrzelec/ml-data-guard"

[tool.hatch.build.targets.wheel]
packages = ["src/mlguard"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["mlguard"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "NPY", "RUF", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"tools/**" = ["S603"]
