[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24"]
build-backend = "hatchling.build"

[project]
name = "ml-data-guard"
version = "0.2.0"
description = "Data validation for ML pipelines, benchmarked with injected faults."
dynamic = ["readme"]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sławomir Strzelec" }]
keywords = ["data-validation", "machine-learning", "data-drift", "benchmark", "mlops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "scipy>=1.11,<2",
]

[project.optional-dependencies]
bench = [
    "scikit-learn>=1.5,<2",
]
figures = [
    "matplotlib>=3.8,<4",
]
api = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9,<1",
]
dev = [
    "scikit-learn>=1.5,<2",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "pytest-timeout>=2.3,<3",
    "hypothesis>=6.100,<7",
    "ruff>=0.6,<1",
    "pip-audit>=2.7,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9,<1",
    "httpx2>=2,<3",
]

[project.scripts]
mlguard = "mlguard.cli:main"

[project.urls]
Repository = "https://github.com/slastrzelec/ml-data-guard"
Homepage = "https://slastrzelec.github.io/portfolio/ml-data-guard/"
Specification = "https://github.com/slastrzelec/ml-data-guard/blob/main/SPEC.md"

[tool.hatch.build.targets.wheel]
packages = ["src/mlguard"]

[tool.hatch.build.targets.sdist]
include = ["src/mlguard", "README.md", "SPEC.md", "LICENSE", "pyproject.toml"]

# PyPI shows the README without the repository around it: relative links and images become
# absolute links to GitHub (checked in tests/test_release.py).
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(!\[[^\]]*\])\((?!https?://)([^)]+)\)'
replacement = '\1(https://raw.githubusercontent.com/slastrzelec/ml-data-guard/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?<!!)(\[[^\]]*\])\((?!https?://|#)([^)]+)\)'
replacement = '\1(https://github.com/slastrzelec/ml-data-guard/blob/main/\2)'

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
# A hung test fails with a traceback instead of blocking the run (thread method: works on Windows).
timeout = 300
timeout_method = "thread"

[tool.coverage.run]
source = ["mlguard"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "NPY", "RUF", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"tools/**" = ["S603"]
