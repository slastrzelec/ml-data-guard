# Copy to .github/workflows/ in a repository that stores a schema and receives data batches.
# The job fails when a batch violates the schema or drifts away from the reference data.
name: Validate data

on:
  pull_request:
    paths: ["data/**", "schema.json"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: slastrzelec/ml-data-guard@v0.2.0
        with:
          batch: data/batch.csv
          schema: schema.json
          reference: data/reference.csv
